name: Build T-Embed Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Обновлено до v4

    - name: Setup Python
      uses: actions/setup-python@v5 # Обновлено до v5
      with:
        python-version: '3.9'

    - name: Install PlatformIO
      run: pip install platformio

    - name: Build firmware
      run: pio run -e esp32dev

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4 # Обновлено до v4 (та самая ошибка была здесь)
      with:
        name: t-embed-firmware
        path: .pio/build/esp32dev/firmware.bin
